name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install nbformat
        run: pip install nbformat
      - name: Validate notebook structural integrity
        run: |
          python -c "
          import nbformat, glob
          for path in glob.glob('*.ipynb'):
              nbformat.read(open(path, encoding='utf-8'), as_version=4)
              print(f'OK: {path}')
          "
